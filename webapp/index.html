<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MAX VPN — быстрый VPN в Telegram</title>
    <meta name="description" content="Личный VPN прямо в Telegram. AmneziaWG для обхода МТС DPI, Subscription URL для Happ. 3 дня бесплатно. Открой @maxvpnesim_bot." />
    <meta name="robots" content="index,follow" />

    <!-- OpenGraph / соцсети -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MAX VPN" />
    <meta property="og:description" content="Личный VPN в Telegram. AmneziaWG для обхода МТС DPI. 3 дня бесплатно." />
    <meta property="og:url" content="https://maxvpnesim.com/" />
    <meta property="og:image" content="https://maxvpnesim.com/logo.png" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" type="image/png" href="/logo.png" />

    <script>
      // SPA-restore (контрагент webapp/public/404.html): GH Pages 404 →
      // 404.html переписывает путь в `?/<path>`, мы тут разворачиваем
      // его обратно через history.replaceState ДО загрузки React, чтобы
      // BrowserRouter увидел правильный pathname на mount. Без этого
      // любой deep-link на GH Pages ломал маршрутизацию.
      // Снимок алгоритма из rafgraph/spa-github-pages (MIT).
      (function () {
        var l = window.location;
        if (l.search && l.search.indexOf("?/") === 0) {
          var decoded = l.search.slice(2).split("&").map(function (s) {
            return s.replace(/~and~/g, "&");
          });
          var newPath = decoded[0];
          var remainingQuery = decoded.slice(1).join("&");
          history.replaceState(
            null, null,
            l.pathname.slice(0, -1) + "/" + newPath +
            (remainingQuery ? "?" + remainingQuery : "") +
            l.hash
          );
        }
      })();
    </script>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
