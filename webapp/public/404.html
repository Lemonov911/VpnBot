<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MAX VPN</title>
    <script>
      // SPA-fallback для GitHub Pages: GH Pages не умеет history-API.
      // Любой deep-link (например /VpnBot/configs) → 404. Здесь мы
      // переписываем путь в query-string `?/<path>` и редиректим на
      // root, где index.html в head ловит этот префикс и восстанавливает
      // исходный URL через history.replaceState. Снимок алгоритма из
      // rafgraph/spa-github-pages (MIT).
      //
      // Поддерживаем два base-path'а одновременно (см. vite.config.ts):
      //   /VpnBot/ — GH Pages, pathSegmentsToKeep=1
      //   /       — maxvpnesim.com / dev (но сюда 404.html не доезжает,
      //             nginx делает try_files; защитный fallback всё равно).
      (function () {
        var l = window.location;
        var firstSeg = l.pathname.split("/")[1];
        var pathSegmentsToKeep = firstSeg === "VpnBot" ? 1 : 0;
        l.replace(
          l.protocol + "//" + l.host +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
          "/?/" +
          l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
